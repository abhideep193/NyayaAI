<!doctype html>
<!--
  NyayaAI's interactive sphere, drawn with WebGL (the browser's graphics engine).
  The owner's sphere image is used as the "skin"; a small shader program bends it:
    - always: the outline wobbles and the inside swirls, so it feels alive
    - hover:  the part under the pointer swells and brightens
    - click/tap: a ripple spreads from that point
    - MODE "thinking": faster swirl and a bright pulse
    - MODE "collapse": shrinks away (answer is ready)
  Placeholders {{IMG}}, {{MODE}}, {{SIZE}} are filled in by streamlit_app.py.
  If WebGL is unavailable, a plain spinning image is shown instead.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  /* The frame is 1.7x the sphere. The glow is a CSS gradient that fades to fully transparent
     BEFORE the frame edge, so there is no visible box. --glow is raised by hover/thinking (script). */
  #stage { --glow: 1; width: calc({{SIZE}}px * 1.7); height: calc({{SIZE}}px * 1.7); position: relative;
           cursor: pointer; display: flex; align-items: center; justify-content: center; }
  #stage::before { content: ""; position: absolute; inset: 0; pointer-events: none;
    background:
      radial-gradient(closest-side at 50% 44%, rgba(34,211,238,.30) 45%, rgba(34,211,238,.10) 68%, rgba(34,211,238,0) 92%),
      radial-gradient(closest-side at 50% 56%, rgba(168,85,247,.26) 45%, rgba(168,85,247,.08) 68%, rgba(168,85,247,0) 92%);
    opacity: calc(0.75 * var(--glow)); }
  .thinking-glow::before { animation: glowpulse 1.2s ease-in-out infinite; }
  @keyframes glowpulse { 50% { opacity: 1; transform: scale(1.06); } }
  canvas { width: 100%; height: 100%; display: block; position: relative; }
  img { width: {{SIZE}}px; height: {{SIZE}}px; border-radius: 50%; animation: spin 40s linear infinite; }
  .collapse { animation: collapse .7s cubic-bezier(.6,0,.4,1) forwards; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes collapse { to { transform: translate(-40%, 35%) scale(.12); opacity: 0; } }
</style>
</head>
<body>
<div id="stage"></div>
<script>
const MODE = "{{MODE}}";          // "idle" | "thinking" | "collapse"
const IMG = "data:image/png;base64,{{IMG}}";
const stage = document.getElementById("stage");
if (MODE === "collapse") stage.classList.add("collapse");
if (MODE === "thinking") stage.classList.add("thinking-glow");

function fallback() {
  const img = new Image(); img.src = IMG; stage.innerHTML = ""; stage.appendChild(img);
}

const canvas = document.createElement("canvas");
const gl = canvas.getContext("webgl", { premultipliedAlpha: true, alpha: true });
if (!gl) { fallback(); } else { stage.appendChild(canvas); start(); }

function start() {
  const vert = `attribute vec2 pos; varying vec2 uv;
    void main() { uv = pos * 0.5 + 0.5; gl_Position = vec4(pos, 0.0, 1.0); }`;
  const frag = `precision mediump float;
    uniform sampler2D tex; uniform float t, hover, thinking; uniform vec2 mouse; uniform vec3 ripple;
    varying vec2 uv;
    const float PAD = 1.7;                                       // canvas size / sphere size
    void main() {
      vec2 q = (uv - 0.5) * PAD;                                 // sphere coordinates (sphere = -0.5..0.5)
      float beat = 0.5 + 0.5 * sin(t * 5.0);

      vec2 p = q;
      p /= 1.0 + thinking * 0.05 * sin(t * 5.0);                 // pulse while thinking
      // Pointer effects first, in screen position, so they happen right under the finger/mouse.
      vec2 d = p - (mouse - 0.5) * PAD;
      float f = exp(-dot(d, d) / 0.025) * hover;
      p -= d * f * 0.6;                                          // the touched part swells
      float rt = t - ripple.z;                                   // ripple after a click/tap
      if (rt > 0.0 && rt < 1.6) {
        vec2 dr = p - (ripple.xy - 0.5) * PAD; float dist = length(dr) + 1e-4, front = rt * 0.35;
        float wave = sin((dist - front) * 45.0) * exp(-rt * 2.2) * smoothstep(0.12, 0.0, abs(dist - front));
        p += dr / dist * wave * 0.025;
      }
      float r = length(p), ang = atan(p.y, p.x);
      float wob = 0.012 * sin(3.0 * ang + t * 1.3) + 0.008 * sin(5.0 * ang - t * 1.7);
      p *= 1.0 - wob * smoothstep(0.2, 0.5, r);                  // living outline
      // Inner swirl SWAYS back and forth (a twist that kept growing would smear the image over time),
      // while the whole sphere turns slowly as one solid piece.
      float sway = sin(t * (0.35 + thinking * 1.4)) * (0.45 + thinking * 0.5) * (1.0 - smoothstep(0.0, 0.5, r));
      float a = sway + t * (0.04 + thinking * 0.25);
      p = mat2(cos(a), -sin(a), sin(a), cos(a)) * p;             // swirl + slow turn
      vec4 c = (abs(p.x) < 0.5 && abs(p.y) < 0.5) ? texture2D(tex, p + 0.5) : vec4(0.0);
      c.rgb *= 1.0 + f * 0.9 + thinking * 0.25 * beat;
      // "Premultiplied" colour (colour x opacity): the standard format every browser expects.
      // (Dividing by a tiny opacity made see-through pixels full-bright: a solid square in Chrome.)
      gl_FragColor = vec4(c.rgb * c.a, c.a);
    }`;
  function shader(type, src) {
    const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  }
  let prog;
  try {
    prog = gl.createProgram();
    gl.attachShader(prog, shader(gl.VERTEX_SHADER, vert));
    gl.attachShader(prog, shader(gl.FRAGMENT_SHADER, frag));
    gl.linkProgram(prog); gl.useProgram(prog);
  } catch (e) { fallback(); return; }

  const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, "pos");
  gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  // No blending: one full-frame image per frame. (Blending here multiplied transparency again,
  // making the glow ~10x too faint.) The browser composites our see-through pixels onto the page.

  const u = n => gl.getUniformLocation(prog, n);
  const uT = u("t"), uHover = u("hover"), uThinking = u("thinking"), uMouse = u("mouse"), uRipple = u("ripple");

  const tex = gl.createTexture(); const img = new Image();
  img.onload = () => {
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    requestAnimationFrame(frame);
  };
  img.src = IMG;

  // Pointer position in the sphere's own coordinates (0..1, origin bottom-left).
  let mouse = [0.5, 0.5], target = 0, hover = 0, ripple = [0.5, 0.5, -10];
  const t0 = performance.now();
  function toUV(e) {
    const b = canvas.getBoundingClientRect();
    return [(e.clientX - b.left) / b.width, 1 - (e.clientY - b.top) / b.height];
  }
  document.addEventListener("pointermove", e => {
    mouse = toUV(e);
    const dx = mouse[0] - 0.5, dy = mouse[1] - 0.5;
    target = Math.hypot(dx, dy) < 0.33 ? 1 : 0;   // the sphere fills the middle 1/1.7 of the canvas
  });
  document.addEventListener("pointerleave", () => { target = 0; });
  document.addEventListener("pointerdown", e => {
    const p = toUV(e); ripple = [p[0], p[1], (performance.now() - t0) / 1000];
  });

  function frame() {
    const dpr = window.devicePixelRatio || 1, w = Math.round(canvas.clientWidth * dpr);
    // A canvas starts at 300x150; check BOTH sides, or a 300px sphere stays squashed to 150px high.
    if (canvas.width !== w || canvas.height !== w) { canvas.width = canvas.height = w; gl.viewport(0, 0, w, w); }
    hover += (target - hover) * 0.08;                      // smooth swell in and out
    stage.style.setProperty("--glow", (1 + hover * 0.35).toFixed(3));   // glow brightens on hover
    gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.uniform1f(uT, (performance.now() - t0) / 1000);
    gl.uniform1f(uHover, hover);
    gl.uniform1f(uThinking, MODE === "thinking" ? 1 : 0);
    gl.uniform2f(uMouse, mouse[0], mouse[1]);
    gl.uniform3f(uRipple, ripple[0], ripple[1], ripple[2]);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(frame);
  }
}
</script>
</body>
</html>
